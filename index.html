<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<title>المحمدي</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

body{
background:#0a0a0a;
color:#f0ede6;
font-family:sans-serif;
max-width:440px;
margin:auto;
}

.card{
background:#111;
padding:14px;
border-radius:10px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:8px;
background:#0a0a0a;
border:1px solid #333;
color:white;
border-radius:6px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.gold{
background:#c8a96e;
color:black;
}

.item{
padding:8px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
}

</style>

</head>

<body>

<div id="root"></div>

<script type="text/babel">

const API =
"https://ibrahemsaad--deeef9c01f9211f1930242dde27851f2.web.val.run/"

const COVER=0.12
const TAX=0.14

function App(){

const [screen,setScreen]=React.useState("home")
const [orders,setOrders]=React.useState({})
const [menu,setMenu]=React.useState({mains:[]})
const [name,setName]=React.useState("")
const [food,setFood]=React.useState("")
const [price,setPrice]=React.useState("")

React.useEffect(()=>{load()},[])

async function load(){

const r=await fetch(API)
const d=await r.json()

if(d.orders)setOrders(d.orders)
if(d.menu)setMenu(d.menu)

}

async function save(o,m){

await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
orders:o,
menu:m
})
})

setOrders(o)
setMenu(m)

}

function addMenu(){

if(!food||!price)return

const m={
...menu,
mains:[
...menu.mains,
{
id:Date.now(),
name:food,
price:parseFloat(price)
}
]
}

save(orders,m)

setFood("")
setPrice("")

}

function addOrder(item){

const o={
...orders,
[name]:item
}

save(o,menu)

}

function bill(){

let text="🍽️ فاتورة المحمدي\n\n"

let total=0

Object.keys(orders).forEach(k=>{

const p=orders[k].price

total+=p

text+=k+" — "+p+" ج\n"

})

const cover=total*COVER
const tax=total*TAX
const grand=total+cover+tax

text+="\nالمجموع "+total
text+="\nكوفير "+cover
text+="\nضريبة "+tax
text+="\nالإجمالي "+grand

navigator.clipboard.writeText(text)

alert(text)

}

return(

<div style={{padding:20}}>

<h2>🍽️ المحمدي</h2>

{screen==="home" && (

<div className="card">

<input
placeholder="اسمك"
value={name}
onChange={e=>setName(e.target.value)}
/>

<button className="gold" onClick={()=>setScreen("order")}>
ابدأ الطلب
</button>

<button onClick={()=>setScreen("admin")}>
⚙️ إدارة المنيو
</button>

</div>

)}

{screen==="order" && (

<div>

<div className="card">

<h3>اختر طلبك</h3>

{menu.mains.map(item=>

<div
className="item"
key={item.id}
onClick={()=>addOrder(item)}
>

<span>{item.name}</span>

<span>{item.price} ج</span>

</div>

)}

</div>

<button onClick={()=>setScreen("home")}>
رجوع
</button>

</div>

)}

{screen==="admin" && (

<div className="card">

<h3>إضافة صنف</h3>

<input
placeholder="اسم الصنف"
value={food}
onChange={e=>setFood(e.target.value)}
/>

<input
placeholder="السعر"
value={price}
onChange={e=>setPrice(e.target.value)}
/>

<button className="gold" onClick={addMenu}>
إضافة
</button>

<button onClick={()=>setScreen("home")}>
رجوع
</button>

</div>

)}

<div className="card">

<h3>الطلبات</h3>

{Object.keys(orders).map(k=>

<div key={k} className="item">

<span>👤 {k}</span>

<span>{orders[k].name}</span>

</div>

)}

</div>

<button onClick={bill}>
🧾 حساب الفاتورة
</button>

</div>

)

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)

</script>

</body>
</html>
