<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>المحمدي</title>

<style>

body{
background:#0a0a0a;
color:#f0ede6;
font-family:sans-serif;
max-width:440px;
margin:0 auto;
}

header{
text-align:center;
padding:30px;
background:#111;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
background:#111;
border:1px solid #333;
color:white;
border-radius:8px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.gold{
background:#c8a96e;
color:black;
}

.card{
background:#111;
padding:14px;
border-radius:10px;
margin-top:10px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #222;
}

</style>

</head>

<body>

<header>
<h1>🍽️ المحمدي</h1>
<p>طلبات الغداء المشتركة</p>
</header>

<div style="padding:16px">

<div class="card">

<p>اسمك</p>
<input id="name">

<button class="gold" onclick="startOrder()">
ابدأ الطلب
</button>

</div>

<div id="menu"></div>

<div id="orders"></div>

<button onclick="showBill()">
🧾 الفاتورة
</button>

</div>

<script>

const API =
"https://ibrahemsaad--deeef9c01f9211f1930242dde27851f2.web.val.run/"

let orders={}
let menu={
mains:[],
starters:[],
juices:[],
desserts:[]
}

async function load(){

const res=await fetch(API)
const data=await res.json()

if(data.orders) orders=data.orders
if(data.menu) menu=data.menu

renderOrders()

}

async function save(){

await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
orders:orders,
menu:menu
})
})

}

function startOrder(){

const name=document.getElementById("name").value.trim()

if(!name) return

const food=prompt("طلبك؟")

orders[name]={main:{name:food,price:100}}

save()

renderOrders()

}

function renderOrders(){

const div=document.getElementById("orders")

div.innerHTML=""

for(const n in orders){

div.innerHTML+=`
<div class="card">
<div class="item">
<span>👤 ${n}</span>
<span>${orders[n].main.name}</span>
</div>
</div>
`

}

}

function showBill(){

let text="🍽️ فاتورة المحمدي\n\n"

let total=0

for(const n in orders){

const price=orders[n].main.price

total+=price

text+=`${n} — ${price} ج\n`

}

const cover=total*0.12
const tax=total*0.14
const grand=total+cover+tax

text+=`\nالمجموع ${total}`
text+=`\nكوفير ${cover}`
text+=`\nضريبة ${tax}`
text+=`\nالإجمالي ${grand}`

alert(text)

}

load()

</script>

</body>
</html>
